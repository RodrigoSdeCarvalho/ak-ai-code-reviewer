# Absolute bars and fixed limits for `aireview eval gate` (design §7).
# Every bar names its provenance. Bars are set from the first promoted baseline (MEASURED + date) and only
# block once accepted in policy.yaml.
bars:
  recall_high:
    op: ">="
    value: 0.75
    mode: strict
    provenance: "MEASURED 2026-10-26 on v1-sonnet-test-k3: 0.901 [0.793, 1.000]; bar = CI lower bound rounded down"
  clean_false_alarm_rate:
    op: "<="
    value: 0.15
    mode: strict
    provenance: "MEASURED 2026-10-26 on v1-sonnet-test-k3: 0.000 over 8 clean cases x 3; bar allows one case alarming in every sample (0.125), not two"
  precision:
    op: ">="
    value: 0.45
    mode: strict
    provenance: "MEASURED 2026-10-26 on v1-sonnet-test-k3: 0.561 [0.468, 0.668]; bar = CI lower bound rounded down"

completeness:
  max_hard_errors: 0          # api_error + schema_error rows left after retries
  max_soft_error_rate: 0.02   # (truncated + refused) / samples
  max_judge_error_rate: 0.02  # failed judgments / judge calls (missing judgments always fail)
  provenance: "design §7"

newly_missed:
  severities: [critical, high]
  baseline_min_rate: 0.66     # baseline detected the bug in >= 2 of 3 samples
  candidate_max_rate: 0.0     # ... and the candidate in none
  max_lost: 1                 # fail on 2+ such bugs: the A/A run lost one by chance alone
  provenance: "MEASURED A/A 2026-10-26: an identical config re-sampled lost 1 high bug (seeded-perf-08/b1, 3/3 -> 0/3)"

cost_latency:
  max_cost_ratio: 1.5
  max_p95_latency_ratio: 1.5
  provenance: "design §7"
