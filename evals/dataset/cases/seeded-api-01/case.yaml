title: >-
  Meeting planner passes buffer and minimum gap to merge_busy in the wrong positional order
language: python
size_bucket: M
provenance:
  origin: authored
  source: null
  author: claude-opus-5-5 (authoring agent)
  created: '2026-10-23'
ground_truth: test-validated
bugs:
- id: b1
  file: scheduling/planner.py
  line_start: 53
  line_end: 53
  severity: high
  category: api_contract
  description: >
    `merge_busy(busy, settings.buffer, settings.min_gap)` passes the arguments positionally, but the signature
    in scheduling/intervals.py is `merge_busy(intervals, min_gap, padding)`. The buffer is used as the
    minimum gap and the minimum gap as padding, so with a 15-minute buffer meetings are suggested directly
    adjacent to existing ones (11:00 right after a 10:00-11:00 meeting instead of 11:15).
  must_find: true
  tags:
  - unshown_context
notes: >
  PR purpose: add PlannerSettings (buffer around meetings, minimum usable gap, start-time step) and a
  `suggest` function that offers several non-overlapping meeting slots; `first_slot` now uses it.
