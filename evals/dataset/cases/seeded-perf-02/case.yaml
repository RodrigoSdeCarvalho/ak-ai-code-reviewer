bugs:
- id: b1
  file: inventory/stocktake.py
  line_start: 51
  line_end: 54
  severity: medium
  category: performance
  description: >
    `active_skus` is built as a list, so `scan.sku not in active_skus` is a linear scan for every stocktake
    scan, making reconciliation O(scans x catalog). A warehouse stocktake with tens of thousands of scans
    against a catalog of tens of thousands of SKUs does hundreds of millions of string comparisons and
    takes seconds to minutes instead of milliseconds; a set gives the same result in linear time.
  must_find: true
notes: >
  PR purpose: during reconciliation, report scans of SKUs that are not active in the catalog (with the
  locations where they were scanned) instead of silently ignoring them.
