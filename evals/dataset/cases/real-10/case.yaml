title: >-
  Pluck falls back to the attribute name when the plucked field's data_key is the empty string
language: python
size_bucket: S
provenance:
  origin: reverted-fix
  source: >-
    https://github.com/marshmallow-code/marshmallow/commit/5761beab3985d654d712f9326e08bfb2e2ec9c4c (committed
    2026-10-19, license MIT)
  author: claude-opus-5-5 (authoring agent)
