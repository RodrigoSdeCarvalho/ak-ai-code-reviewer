title: Blob metadata support fills in content-type on a shared mutable default dict
language: python
size_bucket: M
provenance:
  origin: authored
  source: null
  author: claude-opus-5-5 (authoring agent)
  created: '2026-10-23'
ground_truth: test-validated
bugs:
- id: b1
  file: blobstore/store.py
  line_start: 73
  line_end: 80
  severity: high
  category: logic
  description: >
    `put` takes `metadata: dict[str, str] = {}` and then calls `metadata.setdefault("content-type", ...)`
    on it, so every call without metadata shares and mutates the same dict. The first such upload fixes
    the content type for all later ones in the process (a CSV stored after a PNG is recorded as `image/png`),
    so blobs are served with the wrong Content-Type; callers that pass their own dict also have it mutated.
  must_find: true
notes: >
  PR purpose: let callers attach metadata to blobs (stored in a hidden `.<name>.meta.json` file next to
  the blob, with `content-type` guessed from the extension when missing), add `head()` to read it back
  without loading the blob, and remove the metadata file on delete.
