bugs:
- id: b1
  file: fleet/registry.py
  line_start: 33
  line_end: 35
  severity: high
  category: api_contract
  description: >
    `VehicleRegistry.get` used to raise KeyError for an unknown plate and now returns None. The unchanged
    `ingest_readings` in fleet/maintenance.py still relies on the old contract: it catches KeyError to
    report telematics readings for vehicles that are not registered yet, and otherwise reads `vehicle.odometer_km`.
    A nightly batch containing any unregistered plate now raises AttributeError on None, aborting the
    ingest part-way: the unknown plate is not reported and every later reading in the batch is never recorded.
  must_find: true
  tags:
  - unshown_context
notes: >
  PR purpose: add vehicle retirement (retired_on/reason, retired vehicles excluded from listings and the
  service report, no transfers or services after retirement), depot transfers, and the matching admin
  API handlers; `get` is changed to return None so handlers can answer 404 without try/except.
