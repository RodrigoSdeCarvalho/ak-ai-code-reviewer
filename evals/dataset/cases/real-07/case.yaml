  (on the skipped heap entry and in _is_current) were removed from before/ and fixed/ so the diff does
  not announce the defect; after/ is byte-identical to the fix's parent. The label spans both methods
  because the defect is the same missing currency check in each; a finding on either purge() or pop()
  describing stale heap entries should match. Labels are the buggy-side lines that the fix changed.
