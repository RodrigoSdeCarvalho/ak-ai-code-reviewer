  origin: authored
  source: null
  author: claude-opus-5-5 (authoring agent)
  created: '2026-10-23'
ground_truth: none
bugs: []
notes: >
  PR purpose: deploys restarted the process and logged every user out, so the session store gains a FileSessionStore
  that writes the sessions (keyed by token digest) to disk on every change. Mutations now build a new
  dict and hand it to `_commit` under a lock, so a failed write leaves memory and disk unchanged. Decoy:
  the bare `except:` in FileSessionStore._commit looks like a swallowed exception, but it only removes
  the temporary file and re-raises, which is the right cleanup even for KeyboardInterrupt. Secondary decoy:
  `get` no longer deletes expired sessions; it still returns None for them and purge_expired removes them.
  Tests pin persistence, digest-only storage, failure atomicity, interrupt cleanup and concurrent creates.
  Scope: the store serves a single application process (stated in both class docstrings), so last-writer-wins
  across processes and whole-file rewrites are known design limits of that scope, not defects; a finding
  that raises them at high severity counts as a false alarm.
