bugs:
- id: b1
  file: src/attr/_make.py
  line_start: 1111
  line_end: 1111
  severity: low
  category: api_contract
  description: >
    `add_replace()` passes the module-level public `evolve` function itself to `_add_method_dunders`,
    which mutates the function object in place (sets `__module__`, `__qualname__` and `__doc__` to those
    of the class being built). Every attrs class created on Python 3.13+ therefore rewrites the global
    `attrs.evolve`: after defining class `C1`, `attrs.evolve.__qualname__` is `C1.evolve`, its `__module__`
    is the user's module and its docstring is "Method generated by attrs for class C1.", breaking `help()`,
    introspection and documentation tools. Because all classes share the one function object, each new
    class also renames the `__replace__` of every class defined before it. The method should wrap `evolve`
    in a fresh function per class instead.
  must_find: true
  tags:
  - unshown_context
  - library_knowledge
notes: >
  Reverted fix of python-attrs/attrs PR 1606. Presented to the reviewer as a simplification that drops
  a small local `__replace__` wrapper and assigns `evolve` directly. The defect is only visible if the
  reviewer reads `_add_method_dunders_unsafe` / `_add_method_dunders_safe` further down the same file
  (around line 1222), which mutate their argument. `add_replace` is only called on Python 3.13+ (where
  `copy.replace` exists). `_make.py` is the whole upstream file (about 3460 lines). Deviation from upstream:
  before/ and fixed/ drop the one-line comment the fix added above the wrapper ("We create a local `evolve`
  proxy because it gets modified in place."), because as a deleted line in change.diff it stated the defect
  to the reviewer; code is otherwise byte-identical to the fix commit (before/) and its parent (after/).
