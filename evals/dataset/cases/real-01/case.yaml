id: real-01
kind: real
split: test
title: >-
  Flask parses SERVER_NAME and the test-client host with partition(":"), breaking IPv6 addresses
language: python
size_bucket: S
provenance:
  origin: reverted-fix
  source: >-
    https://github.com/pallets/flask/commit/05e9c6bd630ecf4ec0ec884b1fc7901663737bc7 (committed 2026-08-11,
    license BSD-3-Clause)
  author: claude-opus-5-5 (authoring agent)
  created: '2026-10-23'
ground_truth: fix-derived
bugs:
- id: b1
  file: src/flask/app.py
  line_start: 724
  line_end: 735
  severity: medium
  category: logic
  description: >
    `Flask.run()` splits `SERVER_NAME` on the first colon with `server_name.partition(":")`. For an IPv6
    server name such as `[::1]:8080` this yields host `"["` and port string `":1]:8080"`, so `int(sn_port)`
    raises `ValueError` and the development server cannot start (if a port is passed explicitly but no
    host, `run_simple` is instead given the bogus host `"["` and fails to bind). A bracketed address without
    a port (`[::1]`) crashes the same way. Hostnames and IPv4 addresses are unaffected.
  must_find: true
- id: b2
  file: src/flask/testing.py
  line_start: 180
  line_end: 180
  severity: medium
  category: logic
  description: >
    `FlaskClient.session_transaction()` derives the cookie domain with `ctx.request.host.partition(":")[0]`,
    which for an IPv6 host like `[::1]:8000` gives `"["`. The session cookie written by the transaction
    is stored under the wrong domain, so the next request to the same IPv6 base URL does not send it and
    the values set inside the transaction are silently lost.
  must_find: true
notes: >
  Reverted fix of pallets/flask PR 6096 (issue 6093). Presented to the reviewer as a change that replaces
  `urlsplit`-based host/port parsing with `str.partition(":")` in `Flask.run()` and in the test client's
  `session_transaction()`; it also re-adds a harmless `t.cast(str, host)` and drops the now unused `urlsplit`
  import in app.py. Labels are the lines the upstream fix changed, mapped to the buggy side; b1 spans
  the partition call through the `int(sn_port)` conversion that crashes. Because the diff is a reversal,
  it visibly swaps a robust parser for a naive one, which makes the defect easier to spot than a genuine
  bug-introducing PR would. Both files are whole upstream files (app.py is about 1600 lines).
