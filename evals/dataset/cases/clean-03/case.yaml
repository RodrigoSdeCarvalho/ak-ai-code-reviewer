notes: >
  PR purpose: the online booking page needs the free appointment start times for a date range, so the
  availability module gains busy-interval merging, gap finding and a per-day slot listing. Decoys: `range(len(inside)
  - 1)` in free_gaps looks like it drops the last booking, but it walks the gaps between consecutive bookings
  and the gap after the last booking is added separately; `range((last_day - first_day).days + 1)` looks
  like an extra iteration but is the inclusive last day the docstring promises. Tests pin both, plus merging
  of touching bookings and that every listed slot passes check_bookable.
