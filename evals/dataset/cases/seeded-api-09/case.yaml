bugs:
- id: b1
  file: helpdesk/tickets.py
  line_start: 39
  line_end: 40
  severity: high
  category: api_contract
  description: >
    This PR renames `HelpdeskClient.request`'s `attempts` keyword to `max_attempts` (helpdesk/client.py),
    and the `create_ticket` call it edits still passes `attempts=1`. Because `request` collects unknown
    keywords into `**fields`, the old name is silently accepted as a JSON body field and the call falls
    back to the default of 3 attempts. A ticket POST that times out or gets a 5xx after the server has
    stored it is now sent again, creating duplicate tickets for the customer, and every create request
    carries a stray `attempts` field.
  must_find: true
  alt_locations:
  - file: helpdesk/client.py
    line_start: 36
    line_end: 36
notes: >
  PR purpose: add exponential backoff between retries in the helpdesk client, rename the retry option
  to `max_attempts` to match the new semantics, and let callers set a ticket priority on creation.
