bugs:
- id: b1
  file: textkit/keywords.py
  line_start: 61
  line_end: 61
  severity: high
  category: logic
  description: >
    `frequency + title_bonus if term in title_terms else 0.0` parses as `(frequency + title_bonus) if
    ... else 0.0`, so every term that is not in the title scores 0 instead of its body frequency. With
    no title (the default) all scores are 0 and keywords come out alphabetically; with a title, `suggest_tags`
    drops every body-only term because it falls below MIN_SCORE.
  must_find: true
notes: >
  PR purpose: boost keywords that also appear in the article title (new keyword-only `title` and `title_bonus`
  arguments to extract_keywords) and pass the title from the tagger.
